global:
  scrape_interval: 5s
scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["host.docker.internal:8080"] }]
  - job_name: ingest
    static_configs: [{ targets: ["host.docker.internal:8091"] }]
  - job_name: scheduler
    static_configs: [{ targets: ["host.docker.internal:8092"] }]

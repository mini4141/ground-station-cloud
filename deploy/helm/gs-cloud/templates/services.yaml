{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gs-{{ $name }}
  labels: { app.kubernetes.io/name: gs-{{ $name }}, app.kubernetes.io/part-of: ground-station-cloud }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: gs-{{ $name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: gs-{{ $name }} }
    spec:
      containers:
        - name: {{ $name }}
          image: gs-{{ $name }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- range $k, $v := $.Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ $svc.port }} }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: {{ $svc.port }} }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: certs, mountPath: /certs, readOnly: true }
      volumes:
        - name: certs
          secret: { secretName: {{ $.Values.mqttCertsSecret }} }
---
apiVersion: v1
kind: Service
metadata:
  name: gs-{{ $name }}
spec:
  selector: { app.kubernetes.io/name: gs-{{ $name }} }
  ports:
    - { port: {{ $svc.port }}, targetPort: {{ $svc.port }} }
{{- end }}
